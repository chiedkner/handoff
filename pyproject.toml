[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chiedkner-handoff"
version = "0.1.0"
description = "按交接协议核对传递的字段，标出缺失与被截断的上下文"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "chiedkner" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://chiedkner.github.io"
Repository = "https://github.com/chiedkner/handoff"
Issues = "https://github.com/chiedkner/handoff/issues"

[project.scripts]
handoff = "handoff:main"

[tool.setuptools]
py-modules = ["handoff"]
